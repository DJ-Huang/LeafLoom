name: Build LeafLoom macOS menu
on:
  workflow_dispatch:
jobs:
  menu:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify architecture
        run: test "$(uname -m)" = arm64
      - name: Build branded menu
        run: |
          python -m pip install Pillow
          python scripts/build_brand.py
          python -c "from scripts.create_mac_launcher import build; build(destination='_generated/LeafLoom.app')"
          tar -czf _generated/leafloom-macos-menu.tar.gz -C _generated LeafLoom.app
      - uses: actions/upload-artifact@v4
        with:
          name: leafloom-macos-menu
          path: _generated/leafloom-macos-menu.tar.gz
