name: LeafLoom desktop packages
on:
  workflow_dispatch:
    inputs:
      signed:
        description: Require signing credentials and macOS notarization
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            signing: WINDOWS
          - os: macos-15
            signing: MAC
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      CSC_LINK: ${{ inputs.signed && secrets[format('{0}_CSC_LINK', matrix.signing)] || '' }}
      CSC_KEY_PASSWORD: ${{ inputs.signed && secrets[format('{0}_CSC_KEY_PASSWORD', matrix.signing)] || '' }}
      APPLE_ID: ${{ inputs.signed && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.signed && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ inputs.signed && secrets.APPLE_TEAM_ID || '' }}
      CSC_FOR_PULL_REQUEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - name: Require native Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Desktop dependencies
        run: npm ci --prefix desktop --no-audit --no-fund
      - name: Frontend dependencies
        run: npm ci --prefix web --no-audit --no-fund
      - name: Build shared interface
        run: npm run build --prefix web
      - name: Desktop security and lifecycle checks
        run: npm test --prefix desktop
      - name: Build private backend
        run: python -X utf8 scripts/build_desktop_backend.py
      - name: Build verified Tunnel runtime
        run: python -X utf8 scripts/build_tunnel.py
      - name: Native Tunnel credential and sidecar smoke
        run: node desktop/scripts/run-tunnel-smoke.cjs
      - name: Install smoke-test harness
        run: uv sync --locked --no-dev
      - name: Migration regressions
        run: uv run --no-sync python -X utf8 -m unittest discover -s tests -p test_desktop.py
      - name: MCP authentication and Tunnel lifecycle
        run: uv run --no-sync python -X utf8 -m unittest discover -s tests -p test_tunnel.py
      - name: Require release signing
        if: inputs.signed
        shell: bash
        run: |
          test -n "$CSC_LINK" || { echo 'Signing certificate missing'; exit 1; }
          if [ "$RUNNER_OS" = macOS ]; then
            test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
          fi
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run dist --prefix desktop -- --win --x64
      - name: Package Mac
        if: runner.os == 'macOS'
        run: npm run dist --prefix desktop -- --mac --arm64
      - name: Check relocated Windows payload
        if: runner.os == 'Windows'
        run: uv run --no-sync python -X utf8 scripts/desktop_smoke.py --python dist/desktop/win-unpacked/resources/backend/python/python.exe
      - name: Check relocated Mac payload
        if: runner.os == 'macOS'
        run: uv run --no-sync python -X utf8 scripts/desktop_smoke.py --python dist/desktop/mac-arm64/LeafLoom.app/Contents/Resources/backend/python/bin/python3
      - name: Validate Mac signature and notarization
        if: runner.os == 'macOS' && inputs.signed
        run: |
          codesign --verify --deep --strict --verbose=2 dist/desktop/mac-arm64/LeafLoom.app
          spctl --assess --type execute --verbose=2 dist/desktop/mac-arm64/LeafLoom.app
      - name: Actual desktop window acceptance
        env:
          LEAFLOOM_DESKTOP_EXECUTABLE: ${{ runner.os == 'Windows' && 'dist/desktop/win-unpacked/LeafLoom.exe' || 'dist/desktop/mac-arm64/LeafLoom.app/Contents/MacOS/LeafLoom' }}
        run: node desktop/scripts/acceptance.cjs
      - name: Packaged Tunnel settings acceptance
        env:
          LEAFLOOM_DESKTOP_EXECUTABLE: ${{ runner.os == 'Windows' && 'dist/desktop/win-unpacked/LeafLoom.exe' || 'dist/desktop/mac-arm64/LeafLoom.app/Contents/MacOS/LeafLoom' }}
        run: node desktop/scripts/tunnel-ui-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: leafloom-${{ runner.os }}-${{ inputs.signed && 'signed' || 'unsigned-test' }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-window-${{ runner.os }}
          path: .cache/desktop-acceptance/
