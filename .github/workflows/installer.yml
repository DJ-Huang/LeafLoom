name: Desktop installer acceptance
on:
  workflow_dispatch:
jobs:
  cold-install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check installer regressions
        run: python -X utf8 -m unittest discover -s tests -p test_installer.py -q
      - name: Check native macOS architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Cold install, model inference and HTTP MCP (no interactive desktop)
        run: python -X utf8 scripts/install_smoke.py --no-desktop
      - name: Save acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: _generated/install-validation.json
      - name: Build maintained macOS menu artifact
        if: runner.os == 'macOS'
        run: |
          python -m pip install Pillow==12.3.0
          python -c "from scripts.create_mac_launcher import build; build(destination='_generated/本地知识库.app')"
          tar -czf _generated/macos-launcher.tar.gz -C _generated 本地知识库.app
      - name: Save precompiled menu for repository distribution
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-menu
          path: _generated/macos-launcher.tar.gz
