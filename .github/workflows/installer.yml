name: Desktop installer acceptance
on:
  workflow_dispatch:
    inputs:
      desktop:
        description: 'Build and validate standalone desktop installers'
        type: boolean
        default: false
      acceptance_run_id:
        description: 'Retest an existing Windows desktop installer from an Actions run'
        type: string
        default: ''
jobs:
  desktop:
    if: ${{ inputs.desktop && !inputs.acceptance_run_id }}
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      version: '0.2.0-beta.1'
      with_model: false
      signed: false
      draft_release: false
    secrets: inherit
  desktop-acceptance:
    if: ${{ inputs.acceptance_run_id }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/desktop-acceptance.yml
    with:
      source_run_id: ${{ inputs.acceptance_run_id }}
  cold-install:
    if: ${{ !inputs.desktop && !inputs.acceptance_run_id }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check installer regressions
        run: python -X utf8 -m unittest discover -s tests -p test_installer.py -q
      - name: Check native macOS architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Cold install, model inference and HTTP MCP (no interactive desktop)
        run: python -X utf8 scripts/install_smoke.py --no-desktop
      - name: Save acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: _generated/install-validation.json
