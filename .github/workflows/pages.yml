name: LeafLoom website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/compile_locales.py'
      - 'vault_rag/locales/**'
      - 'assets/brand/**'
      - 'assets/screenshots/**'
      - 'assets/promo/cover.png'
      - 'assets/promo/leafloom-en.mp4'
      - 'tests/test_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/compile_locales.py'
      - 'vault_rag/locales/**'
      - 'assets/brand/**'
      - 'assets/screenshots/**'
      - 'assets/promo/cover.png'
      - 'assets/promo/leafloom-en.mp4'
      - 'tests/test_site.py'
      - '.github/workflows/pages.yml'
  # 'published' already covers draft-to-public and normal releases.
  # 'released' and 'edited' also fired on v0.1.3 publication, causing
  # duplicate builds and competing Pages deployments.
  release:
    types: [published, deleted]
  workflow_dispatch:

permissions:
  contents: read

# Serialize entire production builds, not only the deployment step. This
# prevents an older API snapshot from deploying after a newer publication.
concurrency:
  group: leafloom-website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Website build and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release events must build current main, not the older tagged source.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile authored translations
        run: python scripts/compile_locales.py
      - name: Check localization, assets and unavailable downloads
        run: python -m unittest discover -s tests -p test_site.py -v
      - name: Build public site with the latest stable downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GitHub's releases/latest endpoint may briefly lag a published event.
          # Never deploy a stale version when a newer stable release was published.
          LEAFLOOM_PUBLISHED_TAG: ${{ github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease && github.event.release.tag_name || '' }}
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
