name: LeafLoom website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/compile_locales.py'
      - 'vault_rag/locales/**'
      - 'assets/brand/**'
      - 'assets/screenshots/**'
      - 'assets/promo/cover.png'
      - 'assets/promo/leafloom-en.mp4'
      - 'tests/test_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/compile_locales.py'
      - 'vault_rag/locales/**'
      - 'assets/brand/**'
      - 'assets/screenshots/**'
      - 'assets/promo/cover.png'
      - 'assets/promo/leafloom-en.mp4'
      - 'tests/test_site.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, released, deleted]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Website build and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release events must build current main, not the older tagged source.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile authored translations
        run: python scripts/compile_locales.py
      - name: Check localization, assets and unavailable downloads
        run: python -m unittest discover -s tests -p test_site.py -v
      - name: Build public site with the latest stable downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
