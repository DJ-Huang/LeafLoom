<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1790" viewBox="0 0 1680 1790" role="img" aria-labelledby="title desc"><title id="title">Vault-RAG 本地知识库工作流程与 MCP 工具</title><desc id="desc">根据当前源码绘制：共享 HTTP 服务、原文件管理、五个 MCP 工具、混合检索与增量索引。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#65766f"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c33}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#687970}.heading{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:650}.body{font-size:16px}.small{font-size:14px;fill:#61766b}.edge{fill:none;stroke:#65766f;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1680" height="1790" fill="#f6f7f1"/>
<text x="46" y="54" class="title">Vault-RAG · 本地知识库工作流程</text>
<text x="46" y="86" class="sub">当前实现 · 2026-10-12 · 单进程共享服务 / 原文件管理 / Wiki + 关键词 + BGE-M3</text>
<rect x="32" y="110" width="1616" height="232" rx="18" fill="#edf1e9"/>
<text x="54" y="148" class="heading">01  启动与共享服务</text>
<rect x="54" y="168" width="340" height="145" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="72" y="198" class="label">macOS LaunchAgent</text>
<text x="72" y="226" class="body">登录自动启动，异常退出重启</text>
<text x="72" y="250" class="body">命令：service start / stop / restart</text>
<text x="72" y="274" class="body">另有 install / status / open / uninstall</text>
<rect x="444" y="168" width="590" height="145" rx="13" fill="#e1eee7" stroke="#d6dfd7"/>
<text x="462" y="198" class="label">Python ASGI · 127.0.0.1:18080</text>
<text x="462" y="226" class="body">React + CodeMirror 网页：/；Streamable HTTP MCP：/mcp</text>
<text x="462" y="250" class="body">共享 Runtime：Files / Catalog / Knowledge / EmbeddedModel</text>
<text x="462" y="274" class="body">Host + Origin 校验；MCP 令牌；网页会话 + 写入 CSRF</text>
<rect x="1084" y="168" width="540" height="145" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="1102" y="198" class="label">本地模型与配置</text>
<text x="1102" y="226" class="body">官方 BAAI/bge-m3，dense 1024 维，本地固定版本</text>
<text x="1102" y="250" class="body">模型加载一次；共享锁串行推理；优先 MPS / 后备 CPU</text>
<text x="1102" y="274" class="body">配置、凭据与模型：~/Library/Application Support/VaultRag</text>
<path class="edge" d="M394 240L444 240"/>
<path class="edge" d="M1034 240L1084 240"/>
<rect x="32" y="362" width="1616" height="312" rx="18" fill="#edf1e9"/>
<text x="54" y="400" class="heading">02  两种入口，共用同一份原文件</text>
<rect x="54" y="420" width="745" height="208" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="72" y="450" class="label">网页 / → /api/*</text>
<text x="72" y="478" class="body">首次关联目录；文件树、Markdown 编辑、多标签、属性和双链</text>
<text x="72" y="502" class="body">媒体预览 / Range 流式读取；搜索、关系图、模板与任务视图</text>
<text x="72" y="526" class="body">创建 / 上传 / 移动 / 重命名 / 删除 / 恢复；明确链接随移动修复</text>
<text x="72" y="550" class="body">保存：根目录绑定 + 文件版本校验 → 原子写入；冲突提示合并</text>
<text x="72" y="574" class="body">网页文件搜索覆盖关联目录；不受 AI 索引目录选择限制</text>
<rect x="849" y="420" width="775" height="208" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="867" y="450" class="label">Codex / Cursor / Claude Code → /mcp</text>
<text x="867" y="478" class="body">三个客户端用本机令牌连接同一个 HTTP 服务</text>
<text x="867" y="502" class="body">五个工具：搜索知识、搜索规则、读片段、读全文、查状态</text>
<text x="867" y="526" class="body">AI 只读取当前允许检索的资料；目录外内容不能借 Wiki 绕过</text>
<text x="867" y="550" class="body">自行关联本地目录；默认不索引，按需选择检索范围</text>
<text x="867" y="574" class="body">正文 Notes/；规则 Rules/；导航 Navigation/；工时 EstimationDB/</text>
<text x="56" y="653" class="small">原文件是正文真源；SQLite 目录表覆盖全库，向量只为选中的合格正文生成。</text>
<rect x="32" y="694" width="1616" height="280" rx="18" fill="#edf1e9"/>
<text x="54" y="732" class="heading">03  MCP 工具清单（当前实际提供 5 个）</text>
<rect x="54" y="752" width="505" height="105" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="72" y="782" class="label">vault_search</text>
<text x="72" y="810" class="body">query · top_k=3 · note_type · domain · compact</text>
<text x="72" y="834" class="body">mode=hybrid（默认）| wiki | rag | keyword</text>
<rect x="587" y="752" width="505" height="105" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="605" y="782" class="label">rule_search</text>
<text x="605" y="810" class="body">query · top_k=3 · domain · compact</text>
<text x="605" y="834" class="body">只搜规则目录；当前 domain=pcg 返回空结果</text>
<rect x="1120" y="752" width="504" height="105" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="1138" y="782" class="label">vault_index_status</text>
<text x="1138" y="810" class="body">无需参数；目录、范围、写入目标、文件与片段数</text>
<text x="1138" y="834" class="body">模型、同步进度、最近错误、范围一致性和传输方式</text>
<rect x="54" y="878" width="772" height="72" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="72" y="908" class="label">vault_get_chunk</text>
<text x="72" y="936" class="body">chunk_id → 完整片段；校验当前范围及来源版本</text>
<rect x="854" y="878" width="770" height="72" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="872" y="908" class="label">vault_get_note</text>
<text x="872" y="936" class="body">note_id（笔记 ID 或相对路径）→ 合格正文全文及完整公式</text>
<rect x="32" y="994" width="1616" height="360" rx="18" fill="#edf1e9"/>
<text x="54" y="1032" class="heading">04  查询：当前范围检查 → 多通道检索 → 证据结果</text>
<rect x="54" y="1052" width="365" height="224" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="72" y="1082" class="label">统一范围与来源检查</text>
<text x="72" y="1110" class="body">选中目录 / 子目录排除 / .ragignore</text>
<text x="72" y="1134" class="body">frontmatter 退出；系统与历史区排除</text>
<text x="72" y="1158" class="body">拒绝越界路径与符号链接越界</text>
<text x="72" y="1182" class="body">vault_search 排除规则</text>
<text x="72" y="1206" class="body">普通查询排除工时；工时需显式选择</text>
<text x="72" y="1230" class="body">domain=estimation（或工时 note_type）</text>
<rect x="469" y="1052" width="535" height="224" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="487" y="1082" class="label">关键词 / Wiki / 向量</text>
<text x="487" y="1110" class="body">关键词：中文、技术名称、文件名、ID；读当前正文</text>
<text x="487" y="1134" class="body">Wiki：Navigation 路由至合格来源，检查来源版本</text>
<text x="487" y="1158" class="body">向量：本地 BGE-M3 编码查询 → LanceDB cosine</text>
<text x="487" y="1182" class="body">向量相似度 ≥ 0.45；关键词无需跨过向量门槛</text>
<text x="487" y="1206" class="body">hybrid=三路；wiki=Wiki；keyword=关键词</text>
<text x="487" y="1230" class="body">当前 rag 模式仍包含关键词 + 向量</text>
<rect x="1054" y="1052" width="570" height="224" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="1072" y="1082" class="label">融合、去重与返回</text>
<text x="1072" y="1110" class="body">各通道排名 RRF 融合 → 按文件去重 → 可信度优先</text>
<text x="1072" y="1134" class="body">verified_true / limited 优先；其余作为补充证据</text>
<text x="1072" y="1158" class="body">返回片段 ID、路径、命中通道、版本、可信度及入口</text>
<text x="1072" y="1182" class="body">没有相关证据 → 空结果；过期片段 → 提示重新检索</text>
<text x="1072" y="1206" class="body">模型 / 向量不可用 → 关键词、Wiki 继续并标记降级</text>
<text x="1072" y="1230" class="body">新改正文可先走关键词；旧版本向量不用于改后正文</text>
<path class="edge" d="M419 1158L469 1158"/>
<path class="edge" d="M1004 1158L1054 1158"/>
<text x="56" y="1322" class="small">Wiki 自动维护机械目录与来源版本；来源变化标记待更新。主题总结只由明确整理请求中的对话 LLM 更新。服务不内嵌生成模型。</text>
<rect x="32" y="1374" width="1616" height="304" rx="18" fill="#edf1e9"/>
<text x="54" y="1412" class="heading">05  文件与配置变更 → 增量同步 → 原子发布</text>
<rect x="54" y="1432" width="350" height="176" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="72" y="1462" class="label">变化检测与轻量目录表</text>
<text x="72" y="1490" class="body">网页保存事件 + 每 2 秒轮询</text>
<text x="72" y="1514" class="body">扫描关联目录，更新文件 / 属性 / 链接</text>
<text x="72" y="1538" class="body">配置目录选择决定正文候选</text>
<text x="72" y="1562" class="body">README、导航、附件不做正文向量</text>
<text x="72" y="1586" class="body">撤销范围 / 退出条目立即停止召回</text>
<rect x="449" y="1432" width="355" height="176" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="467" y="1462" class="label">切片与 embedding 缓存</text>
<text x="467" y="1490" class="body">合格 .md / .txt 正文 → 分片</text>
<text x="467" y="1514" class="body">缓存键 = 内容 + 模型指纹</text>
<text x="467" y="1538" class="body">已有缓存复用，仅新内容计算</text>
<text x="467" y="1562" class="body">共享模型锁；每批最多 4 个分片</text>
<text x="467" y="1586" class="body">未准备模型：等待；文件网页仍可用</text>
<rect x="849" y="1432" width="355" height="176" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="867" y="1462" class="label">后台生成新索引版本</text>
<text x="867" y="1490" class="body">.vault-rag/generations/&lt;版本&gt;/</text>
<text x="867" y="1514" class="body">LanceDB + 文档 / 片段 / Wiki 来源</text>
<text x="867" y="1538" class="body">构建后再校验目录与配置版本</text>
<text x="867" y="1562" class="body">成功 → 原子切换 current.json</text>
<text x="867" y="1586" class="body">失败 → 保留完整旧版并报告错误</text>
<rect x="1249" y="1432" width="375" height="176" rx="13" fill="#fff" stroke="#d6dfd7"/>
<text x="1267" y="1462" class="label">下一次检索读取新版本</text>
<text x="1267" y="1490" class="body">保留最近 2 个索引版本</text>
<text x="1267" y="1514" class="body">新来源与模型指纹参与一致性检查</text>
<text x="1267" y="1538" class="body">片段 ID 变化后需重新检索</text>
<text x="1267" y="1562" class="body">状态工具与网页共用同步状态</text>
<text x="1267" y="1586" class="body">Ollama 不参与启动、索引或查询</text>
<path class="edge" d="M404 1518L449 1518"/>
<path class="edge" d="M804 1518L849 1518"/>
<path class="edge" d="M1204 1518L1249 1518"/>
<text x="54" y="1654" class="small">两种数据边界：关联目录 = 网页可浏览范围；勾选的索引目录 = AI 可检索范围。未勾选目录无需写 .ragignore。</text>
<text x="46" y="1718" class="small">依据源码：web_server.py · knowledge.py · embedded_model.py · local_state.py · catalog.py · service_control.py</text>
<text x="46" y="1748" class="small">本图描述当前实现；MCP 仅提供检索与读取，文件编辑和目录管理通过本地网页 API 完成。</text>
</svg>
