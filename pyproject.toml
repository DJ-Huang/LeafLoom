[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vault-rag"
version = "0.1.4"
description = "LeafLoom: local-first knowledge base and personal wiki for Markdown and HTML, with MCP, Skills, AI Chat and ChatGPT integration"
keywords = ["knowledge-management", "personal-wiki", "local-first", "markdown", "html", "mcp", "agent-skills", "ai-chat", "chatgpt", "rag", "knowledge-graph"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "llama-index-core>=0.11.0,<0.15.0",
  "sentence-transformers>=5.7,<6",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "ruamel.yaml>=0.18,<0.19",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "llama-index-vector-stores-lancedb>=0.2.0",
  "llama-index-retrievers-bm25>=0.2.0",
  "lancedb>=0.38.0,<0.39",
  "pandas>=2.0.0,<3",
  "pathspec>=0.12.1",
  "watchfiles>=1.1,<2",
  "pydantic-settings>=2.2.0",
  "python-frontmatter>=1.1.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "mcp>=1.30.0,<2.0.0",
  "pystray>=0.19.5,<0.20; sys_platform == 'win32'",
  "Pillow>=11,<13",
  "torch>=2.2,<3",
  "msvc-runtime==14.44.35112; sys_platform == 'win32' and python_version < '3.15'",
]

[project.optional-dependencies]
publish = ["playwright>=1.50,<2"]

[project.urls]
Homepage = "https://github.com/DJ-Huang/LeafLoom"
Repository = "https://github.com/DJ-Huang/LeafLoom"
Issues = "https://github.com/DJ-Huang/LeafLoom/issues"

[project.scripts]
vault-rag = "vault_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vault_rag"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32'" }]

[tool.hatch.build.targets.wheel.force-include]
"vault_rag/static" = "vault_rag/static"
"assets/brand" = "vault_rag/brand"
"wiki-search/SKILL.md" = "vault_rag/skills/wiki-search/SKILL.md"
